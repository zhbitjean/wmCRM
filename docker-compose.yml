services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wmcrm
      POSTGRES_USER: wmcrm
      POSTGRES_PASSWORD: change-me
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmcrm"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

