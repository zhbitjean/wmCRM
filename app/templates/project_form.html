{% extends 'base.html' %}{% block title %}New project · WM CRM{% endblock %}{% block content %}
<a class="back" href="/projects">← Projects</a><div class="form-heading"><span class="eyebrow">Daily operations</span><h1>New project</h1><p>Create the job address first, then add every person and company involved.</p></div>
<form method="post" action="/projects/new" class="card contact-form">
  <fieldset><legend>Job address</legend><label>Street address <span>*</span><input name="street_address" required autofocus placeholder="2600 Amsterdam Ave"></label><div class="form-grid two"><label>City <span>*</span><input name="city" required value="New York"></label><label>NYC borough<select name="borough"><option value="">Auto-detect / outside NYC</option>{% for borough in boroughs %}<option value="{{ borough }}">{{ borough }}</option>{% endfor %}</select></label><label>State<input name="state" value="NY" maxlength="2"></label><label>ZIP code<input name="zip_code" inputmode="numeric"></label><label>Unit<input name="unit_number" placeholder="Optional apartment or store"></label></div></fieldset>
  <fieldset><legend>Project</legend><label>Project name <span>*</span><input name="project_name" required placeholder="Interior Renovation"></label><div class="form-grid two"><label>Type<input name="project_type" placeholder="Renovation, New Building, Inspection…"></label><label>Status<select name="status"><option>Active</option><option>On Hold</option><option>Completed</option><option>Archived</option></select></label></div><label>Client company<select name="client_company_id"><option value="">Assign later</option>{% for c in companies %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Internal notes<textarea name="internal_notes" rows="3"></textarea></label></fieldset>
  <div class="form-actions"><a href="/projects" class="cancel-button">Cancel</a><button>Save and add contacts</button></div>
</form>{% endblock %}
