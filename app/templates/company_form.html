{% extends 'base.html' %}{% block title %}Add company · WM CRM{% endblock %}{% block content %}<a class="back" href="/companies">← Companies</a><div class="form-heading"><span class="eyebrow">New organization</span><h1>Add a company</h1><p>Create the organization, then assign it to projects as Client, GC, Architect, Engineer, or another role.</p></div><form method="post" action="/companies/new" class="card contact-form"><fieldset><legend>Company</legend><label>Company name <span>*</span><input name="company_name" required autofocus></label><label>Alternate name<input name="alternate_name"></label><div class="form-grid two"><label>Phone<input name="phone" type="tel"></label><label>Fax<input name="fax" type="tel"></label><label>Email<input name="email" type="email"></label></div><label>Address<input name="address"></label><label>NYC borough<select name="borough"><option value="">Auto-detect / outside NYC</option>{% for borough in boroughs %}<option value="{{ borough }}">{{ borough }}</option>{% endfor %}</select></label><label>Notes<textarea name="notes" rows="4"></textarea></label></fieldset><div class="form-actions"><a class="cancel-button" href="/companies">Cancel</a><button>Save company</button></div></form>{% endblock %}
